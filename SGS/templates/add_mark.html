{% extends 'base.html' %}

{% block title %}Add Student Marks{% endblock %}

{% block content %}

<h2>Add Marks for {{ student.name }}</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Save Marks</button>
</form>

<a href="{% url 'student_detail' student.id %}">Back to Student Details</a>

{% endblock %}
