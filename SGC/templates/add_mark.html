
{% extends 'base.html' %}

{% block title %}Add Student Marks{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-heading">
        <h2>Enter Student Marks</h2>
        <p>Student: <strong>{{ student.name }}</strong></p>
    </div>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Marks
        </button>

        <a href="{% url 'student_detail' student.id %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
