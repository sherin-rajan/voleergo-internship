{% extends 'base.html' %}

{% block title %}Add Subject{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-heading">
        <h2>Add New Subject</h2>
        <p>Enter the subject details below.</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Subject
        </button>

        <a href="{% url 'home' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
